services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pay
      POSTGRES_PASSWORD: pay
      POSTGRES_DB: pay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pay -d pay"]
      interval: 2s
      timeout: 3s
      retries: 20

  bot:
    build: .
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      DATABASE_URL: postgresql+asyncpg://pay:pay@postgres:5432/pay
      RPC_URL: ${RPC_URL}
      CHAIN_ID: ${CHAIN_ID}
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      ROUTER_ADDRESS: ${ROUTER_ADDRESS}
      USDC_ADDRESS: ${USDC_ADDRESS}
      RELAYER_POL_THRESHOLD: ${RELAYER_POL_THRESHOLD:-10000000000000000}
      MAX_FEE_PER_GAS: ${MAX_FEE_PER_GAS:-500000000000}
      MAX_PRIORITY_FEE_PER_GAS: ${MAX_PRIORITY_FEE_PER_GAS:-50000000000}
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
