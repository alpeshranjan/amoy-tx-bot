[project]
name = "paybot"
version = "0.1.0"
description = "Telegram transfers of test USDC on Polygon Amoy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cryptography>=44.0",
    "eth-account>=0.13",
    "openai>=1.55",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "web3>=7.0",
]

[project.scripts]
paybot = "bot.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
